<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SecurePortal{% endblock %}</title>
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0e1a">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}?v=2">

  <style>
    [hidden] { display: none !important; }
    html, body { background: #0a0e1a; color: #e6ecf5; margin: 0; }
  </style>
</head>

<body data-page="{% block page_id %}secure{% endblock %}">

  {% block body %}{% endblock %}

  <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>

</body>
</html>
